name: Production Static Deployment Factory

on:
  push:
    branches: [ main ]

jobs:
  deploy-portfolio-nodes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Inject Central Graph Telemetry Secrets
        run: |
          sed -i "s|%%SUPABASE_URL_PLACEHOLDER%%|${{ secrets.SUPABASE_URL }}|g" src/js/telemetry.js
          sed -i "s|%%SUPABASE_KEY_PLACEHOLDER%%|${{ secrets.SUPABASE_ANON_KEY }}|g" src/js/telemetry.js

      - name: Deploy Live Sandbox to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./src
          vercel-args: '--prod'
